version: 2

models:
  - name: fct_hourly_price_weather
    description: "One row per delivery hour: primary price, cross-source price, and weather. Grain: hour_utc."
    config:
      contract:
        enforced: true
    columns:
      - name: hour_utc
        description: "Delivery hour in UTC; the natural key of the fact."
        data_type: timestamp
        tests: [unique, not_null]
      - name: hour_local
        description: "Same hour in Europe/Amsterdam local time."
        data_type: timestamp
        tests: [not_null]
      - name: price_eur_mwh
        description: "Primary day-ahead price for the hour."
        data_type: double precision
        tests: [not_null]
      - name: price_eur_mwh_cross_source
        description: "The other source's price for the same hour, when both published it."
        data_type: double precision
      - name: price_diff_eur
        description: "Absolute difference between the two sources; the alignment test keeps it within 2 EUR/MWh."
        data_type: double precision
      - name: price_source
        description: "Which source supplied the primary price: 'entsoe' (authoritative) or 'energycharts' (fallback for hours ENTSO-E has not published)."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['entsoe', 'energycharts']
      - name: has_weather_match
        description: "True when a weather observation or reanalysis row joined this hour."
        data_type: boolean
        tests: [not_null]
      - name: weather_source
        description: "Which source supplied the weather: 'knmi' (station observations) or 'openmeteo' (ERA5 reanalysis fallback)."
        data_type: text
      - name: temp_c
        description: "Air temperature in degrees Celsius."
        data_type: double precision
      - name: wind_ms
        description: "Wind speed in metres per second."
        data_type: double precision
      - name: radiation_jm2
        description: "Global radiation in joules per square metre."
        data_type: double precision
      - name: hour_local_label
        description: "KNMI's 1-24 local hour label; nullable when the hour has no weather match."
        data_type: bigint
      - name: is_negative_price
        description: "True when the primary price is below zero."
        data_type: boolean
        tests: [not_null]

  - name: mart_daily_summary
    description: "Local-day aggregates for BI consumption. Grain: local_date (Europe/Amsterdam)."
    config:
      contract:
        enforced: true
    columns:
      - name: local_date
        description: "Local calendar date."
        data_type: date
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_date')
              field: local_date
      - name: hours_in_day
        description: "Delivery hours present for that date (24, or 23/25 on DST days)."
        data_type: bigint
        tests: [not_null]
      - name: avg_price_eur_mwh
        data_type: double precision
      - name: min_price_eur_mwh
        data_type: double precision
      - name: max_price_eur_mwh
        data_type: double precision
      - name: negative_price_hours
        description: "Hours that day whose price was below zero."
        data_type: bigint
        tests: [not_null]
      - name: avg_temp_c
        data_type: double precision
      - name: max_wind_ms
        data_type: double precision
      - name: total_radiation_mj_m2
        description: "Daily global radiation in megajoules per square metre."
        data_type: double precision

  - name: dim_date
    description: >
      Conformed date dimension, one row per calendar date from 2020 to 2035.
      Joins mart_daily_summary on local_date and fct_hourly_price_weather on
      cast(hour_local as date). hours_in_day follows Europe/Amsterdam DST.
      Grain: local_date.
    config:
      contract:
        enforced: true
    columns:
      - name: local_date
        description: "Calendar date; the key other models join on."
        data_type: date
        tests: [unique, not_null]
      - name: year
        data_type: bigint
        tests: [not_null]
      - name: quarter
        data_type: bigint
        tests: [not_null]
      - name: month
        description: "Month number, 1-12."
        data_type: bigint
        tests: [not_null]
      - name: month_name
        description: "English month name, for example 'March'."
        data_type: text
        tests: [not_null]
      - name: day_of_month
        data_type: bigint
        tests: [not_null]
      - name: iso_year
        description: "ISO 8601 week-numbering year; differs from year in the first and last days of some years."
        data_type: bigint
        tests: [not_null]
      - name: iso_week
        description: "ISO 8601 week number, 1-53."
        data_type: bigint
        tests: [not_null]
      - name: iso_day_of_week
        description: "ISO 8601 day of week: 1 = Monday, 7 = Sunday."
        data_type: bigint
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7]
              quote: false
      - name: day_name
        description: "English day name, for example 'Sunday'."
        data_type: text
        tests: [not_null]
      - name: is_weekend
        description: "True on Saturday and Sunday."
        data_type: boolean
        tests: [not_null]
      - name: hours_in_day
        description: "Length of the Europe/Amsterdam day in hours: 24, or 23/25 on DST change days."
        data_type: bigint
        tests:
          - not_null
          - accepted_values:
              values: [23, 24, 25]
              quote: false
      - name: is_dst_change_day
        description: "True when hours_in_day is not 24."
        data_type: boolean
        tests: [not_null]

exposures:
  - name: powerbi_nl_energy_dashboard
    label: "NL Energy Dashboard (Power BI)"
    type: dashboard
    maturity: high
    url: https://github.com/kaeldrin-gh/nl-energy-warehouse/tree/master/powerbi
    description: >
      Power BI dashboard built on the Parquet exports of these marts
      (powerbi/nl-energy-dashboard.pbix). Rebuilt measures in
      analysis/powerbi_measures.md; visuals mapped to bi_queries.sql.
    depends_on:
      - ref('fct_hourly_price_weather')
      - ref('mart_daily_summary')
    owner:
      name: kaeldrin-gh
