name: docs

on:
  push:
    branches: [main, master]
  schedule:
    # Daily at 14:30 UTC, after the ingest run (~13:45) has freshened the marts.
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Build the report from live sources (requires ENTSOE_TOKEN)"
        type: boolean
        default: false

# Workflow-level env may read `secrets`; step `if:` conditions cannot.
env:
  ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dbt,test]"

      # Scheduled/manual live builds feed the report from the real market.
      # Pushes and forks without the token use the deterministic sample, so the
      # catalog always deploys.
      #
      # The runner starts with an empty warehouse, and an incremental load only
      # reaches back 30 days, so live builds first backfill 13 months (enough
      # for the report's monthly table). The backfill is best-effort: if a
      # source fails partway, the incremental load still runs and the report
      # header states the coverage that actually loaded.
      #
      # energy-charts is optional in the incremental load: if only the fallback
      # fails, the build continues and the report shows the missing hours with
      # their cause (INC-011). Any other failed source fails this step, nothing
      # deploys, and Pages keeps the last good report.
      - name: Load data (live on schedule/manual, sample otherwise)
        id: load
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            if [ -n "$ENTSOE_TOKEN" ]; then
              python -m ingest.cli load --backfill --from "$(date -u -d '13 months ago' +%Y-%m-01)" \
                --sources entsoe,energycharts,openmeteo \
                || echo "::warning::13-month backfill incomplete; the report covers what loaded"
              python -m ingest.cli load --optional-sources energycharts
              echo "live=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          python -m ingest.cli load --sample
          echo "live=0" >> "$GITHUB_OUTPUT"

      - name: Load news headlines (live builds only, optional)
        if: steps.load.outputs.live == '1'
        continue-on-error: true
        run: python -m ingest.cli news

      - name: dbt build
        run: python -m ingest.cli build

      - name: dbt docs generate
        run: dbt docs generate --project-dir dbt --profiles-dir dbt
        env:
          DUCKDB_PATH: warehouse/energy.duckdb

      - name: Generate live report (live builds only)
        if: steps.load.outputs.live == '1'
        run: python -m ingest.cli report

      - name: Add the live report to the site (live builds only)
        if: steps.load.outputs.live == '1'
        run: cp exports/report.html dbt/target/report.html

      # One Pages site per repo, and each deployment replaces it, so a
      # sample-data deploy must carry the last live report forward instead of
      # deleting it. Skips cleanly before the first live run.
      - name: Preserve the last live report (non-live builds)
        if: steps.load.outputs.live != '1'
        run: |
          if curl -fsSL -o dbt/target/report.html \
            https://kaeldrin-gh.github.io/nl-energy-warehouse/report.html; then
            echo "kept the previously deployed report"
          else
            rm -f dbt/target/report.html
            echo "no previously deployed report found"
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dbt/target

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
