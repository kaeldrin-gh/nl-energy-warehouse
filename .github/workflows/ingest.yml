name: ingest

on:
  schedule:
    # Daily after ENTSO-E publishes day-ahead prices for D+1 (~14:30 CET).
    - cron: "45 13 * * *"
  workflow_dispatch:

# Workflow-level env may read `secrets`; job/step-level may not.
env:
  ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dbt,test]"

      - name: Skip gracefully without ENTSOE_TOKEN
        if: env.ENTSOE_TOKEN == ''
        run: |
          echo "::notice::ENTSOE_TOKEN secret not set - live ingest disabled on this fork."
          echo "Add the secret to enable the scheduled pipeline."

      - name: Incremental ingest (7-day revision lookback)
        if: env.ENTSOE_TOKEN != ''
        run: python -m ingest.cli load

      - name: Load energy-news headlines (optional enrichment)
        if: always() && env.ENTSOE_TOKEN != ''
        continue-on-error: true
        run: python -m ingest.cli news

      # always() keeps these running even when a source failed mid-load: a
      # partial batch still ships its build, export and artifact. The failed
      # load step keeps the run red so the alert fires.
      - name: dbt build (refetches and retries once on an alignment flap, INC-010)
        if: always() && env.ENTSOE_TOKEN != ''
        run: python -m ingest.cli build
        env:
          DUCKDB_PATH: warehouse/energy.duckdb

      - name: dbt source freshness (live sources)
        if: always() && env.ENTSOE_TOKEN != ''
        run: dbt source freshness --select source:raw.entsoe_prices source:raw.energycharts_prices source:raw.openmeteo_weather --project-dir dbt --profiles-dir dbt
        env:
          DUCKDB_PATH: warehouse/energy.duckdb

      - name: Export marts
        if: always() && env.ENTSOE_TOKEN != ''
        run: python -m ingest.cli export

      - name: Metrics summary (rendered on this run's page)
        if: always() && env.ENTSOE_TOKEN != ''
        run: python -m ingest.cli summary | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          DUCKDB_PATH: warehouse/energy.duckdb

      - name: Generate HTML report
        if: always() && env.ENTSOE_TOKEN != ''
        continue-on-error: true  # marts can be missing after a failed build
        run: python -m ingest.cli report
        env:
          DUCKDB_PATH: warehouse/energy.duckdb

      - name: Upload mart exports
        if: always() && env.ENTSOE_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: mart-exports
          path: exports/
          retention-days: 7
